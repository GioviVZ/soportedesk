<form (submit)="onSubmit($event)" class="mobile-resource-form" id="asignacion-numero-movil-form">
  @if (errorMessage) { <div class="form-error" role="alert">{{ errorMessage }}</div> }

  <app-section-card title="Equipo y línea">
    <i icon class="ti ti-device-sim" aria-hidden="true"></i>
    <div class="form-grid" [formGroup]="form">
      <label class="field field--full">
        <span>Equipo *</span>
        <select formControlName="equipoMovilId">
          <option [ngValue]="null">Seleccione...</option>
          @for (equipo of equipos; track equipo.id) { <option [ngValue]="equipo.id">{{ equipoOption(equipo) }}</option> }
        </select>
        @if (equipos.length === 0) { <small class="inventory-link-hint">Registra primero el equipo en Inventario</small> }
        @if (isInvalid('equipoMovilId')) { <small class="field-error">Selecciona un equipo.</small> }
      </label>
      <label class="field">
        <span>Número *</span><input type="text" inputmode="numeric" maxlength="9" formControlName="numero" placeholder="987654321" />
        @if (isInvalid('numero')) { <small class="field-error">Ingresa 9 dígitos, empezando por 9.</small> }
      </label>
      <label class="field">
        <span>Operador *</span>
        <select formControlName="operador">
          @for (operador of operadores; track operador) { <option [value]="operador">{{ operador }}</option> }
        </select>
      </label>
      <label class="field"><span>Plan</span><input type="text" formControlName="plan" /></label>
      <label class="field">
        <span>ICCID de SIM</span><input type="text" inputmode="numeric" maxlength="20" formControlName="simIccid" />
        @if (isInvalid('simIccid')) { <small class="field-error">Ingresa un ICCID de 19 o 20 dígitos.</small> }
      </label>
    </div>
  </app-section-card>

  <app-section-card title="Responsable">
    <i icon class="ti ti-user" aria-hidden="true"></i>
    <div class="form-grid" [formGroup]="form">
      <label class="field"><span>Persona asignada *</span><input type="text" formControlName="personaNombre" /></label>
      <label class="field">
        <span>DNI</span><input type="text" inputmode="numeric" maxlength="8" formControlName="personaDni" />
        @if (isInvalid('personaDni')) { <small class="field-error">Ingresa un DNI de 8 dígitos.</small> }
      </label>
      <label class="field field--full">
        <span>Dependencia</span>
        <select formControlName="dependenciaId">
          <option [ngValue]="null">Seleccione...</option>
          @for (dependencia of dependencias; track dependencia.id) { <option [ngValue]="dependencia.id">{{ dependencia.nombre }}</option> }
        </select>
      </label>
    </div>
  </app-section-card>

  <app-section-card title="Vigencia">
    <i icon class="ti ti-calendar" aria-hidden="true"></i>
    <div class="form-grid" [formGroup]="form">
      <label class="field">
        <span>Fecha de inicio *</span><input type="date" formControlName="fechaInicio" />
        @if (isInvalid('fechaInicio')) { <small class="field-error">La fecha de inicio es obligatoria.</small> }
      </label>
      <label class="field">
        <span>Fecha de fin</span><input type="date" formControlName="fechaFin" />
        @if (form.hasError('fechaFinRequerida') && (form.touched || form.get('fechaFin')?.touched)) {
          <small class="field-error">La fecha de fin es obligatoria cuando la asignación está finalizada.</small>
        }
        @if (form.hasError('fechaFinAnterior') && (form.touched || form.get('fechaFin')?.touched)) {
          <small class="field-error">La fecha de fin debe ser igual o posterior a la fecha de inicio.</small>
        }
      </label>
      <label class="field">
        <span>Estado *</span>
        <select formControlName="estado">
          @for (estado of estados; track estado) { <option [value]="estado">{{ estado }}</option> }
        </select>
      </label>
    </div>
  </app-section-card>

  <app-section-card title="Observaciones">
    <i icon class="ti ti-notes" aria-hidden="true"></i>
    <div [formGroup]="form"><label class="field"><span>Observaciones</span><textarea rows="4" formControlName="observaciones"></textarea></label></div>
  </app-section-card>

  <div class="form-actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Guardando...' : (asignacion ? 'Guardar cambios' : 'Registrar asignación') }}</button>
  </div>
</form>
