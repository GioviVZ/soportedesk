<form (submit)="onSubmit($event)" class="equipo-red-form" id="equipo-red-edit-form">
  @if (errorMessage) {
    <div class="form-error" role="alert">{{ errorMessage }}</div>
  }

  <app-section-card title="1. Ubicación">
    <i icon class="ti ti-map-pin" aria-hidden="true"></i>
    <app-ubicacion-select
      [showTipoContrato]="false"
      [(sedeId)]="sedeId"
      [(dependenciaId)]="dependenciaId"
      [(subdependenciaId)]="subdependenciaId"
    />

    <div class="form-grid location-details" [formGroup]="form">
      <label class="field field--full">
        <span>Referencia</span>
        <input type="text" formControlName="referencia" placeholder="Ej. sala de comunicaciones" />
      </label>

      <div class="coordinates field--full">
        <div class="coordinates-title">
          <strong>Coordenadas</strong>
          <span>Ubicación geográfica exacta del equipo.</span>
        </div>
        <div class="coordinates-grid">
          <label class="field">
            <span>Latitud</span>
            <input type="number" step="0.000001" formControlName="latitud" placeholder="-12.082000" />
            @if (isInvalid('latitud')) { <small class="field-error">Ingresa una latitud entre −90 y 90.</small> }
          </label>
          <label class="field">
            <span>Longitud</span>
            <input type="number" step="0.000001" formControlName="longitud" placeholder="-76.943000" />
            @if (isInvalid('longitud')) { <small class="field-error">Ingresa una longitud entre −180 y 180.</small> }
          </label>
        </div>
        <app-map-picker
          [latitud]="form.controls.latitud.value"
          [longitud]="form.controls.longitud.value"
          (coordenadasChange)="onCoordenadas($event)"
        />
      </div>

      <label class="field">
        <span>Edificio</span>
        <input type="text" formControlName="edificio" />
      </label>
      <label class="field">
        <span>Piso</span>
        <input type="text" formControlName="piso" />
      </label>
      <label class="field">
        <span>Gabinete</span>
        <input type="text" formControlName="gabinete" />
      </label>
    </div>
  </app-section-card>

  <app-section-card title="2. Identificación del equipo">
    <i icon class="ti {{ meta.icon }}" aria-hidden="true"></i>
    <div class="form-grid" [formGroup]="form">
      <label class="field">
        <span>Marca *</span>
        <input type="text" formControlName="marca" list="equipo-red-marcas" autocomplete="off" />
        <datalist id="equipo-red-marcas">
          @for (marca of marcas; track marca) { <option [value]="marca"></option> }
        </datalist>
        @if (isInvalid('marca')) { <small class="field-error">La marca es obligatoria.</small> }
      </label>
      <label class="field">
        <span>Modelo *</span>
        <input type="text" formControlName="modelo" />
        @if (isInvalid('modelo')) { <small class="field-error">El modelo es obligatorio.</small> }
      </label>
      <label class="field">
        <span>Número de serie</span>
        <input type="text" formControlName="serie" />
      </label>
      <label class="field">
        <span>Código patrimonial</span>
        <input type="text" formControlName="codigoPatrimonial" />
      </label>
      <label class="field">
        <span>Código de inventario 2025</span>
        <input type="text" formControlName="codigoInventario" />
      </label>
      <label class="field">
        <span>Etiqueta</span>
        <input type="text" formControlName="etiqueta" [placeholder]="'Ej. ' + etiquetaPrefix + '-SEDE-P03-01'" />
      </label>
      <label class="field">
        <span>Estado *</span>
        <select formControlName="estado">
          @for (option of estadoOptions; track option.value) {
            <option [value]="option.value">{{ option.value }}</option>
          }
        </select>
      </label>
    </div>
  </app-section-card>

  <app-section-card title="3. Configuración de red">
    <i icon class="ti ti-network" aria-hidden="true"></i>
    <div class="form-grid" [formGroup]="form">
      <label class="field">
        <span>MAC</span>
        <input type="text" formControlName="mac" placeholder="AA:BB:CC:DD:EE:FF" />
        <small class="field-hint">Formato AA:BB:CC:DD:EE:FF.</small>
        @if (isInvalid('mac')) { <small class="field-error">Ingresa una dirección MAC válida.</small> }
      </label>
      <label class="field">
        <span>IP</span>
        <input type="text" formControlName="ip" placeholder="192.168.1.10" />
        @if (isInvalid('ip')) { <small class="field-error">Ingresa una dirección IPv4 válida.</small> }
      </label>
      <label class="field">
        <span>IP por defecto</span>
        <input type="text" formControlName="ipPorDefecto" placeholder="192.168.1.1" />
        @if (isInvalid('ipPorDefecto')) { <small class="field-error">Ingresa una dirección IPv4 válida.</small> }
      </label>
      <label class="field">
        <span>Host</span>
        <input type="text" formControlName="host" />
      </label>
    </div>
  </app-section-card>

  @if (tipo === 'RADIOENLACE') {
    <app-section-card class="enlace-section" title="4. Enlace">
      <i icon class="ti ti-antenna" aria-hidden="true"></i>
      <div class="form-grid" [formGroup]="form">
        <label class="field">
          <span>Sede remota</span>
          <select formControlName="remotoSedeId">
            <option [ngValue]="null">Seleccione...</option>
            @for (sede of remotoSedes; track sede.id) { <option [ngValue]="sede.id">{{ sede.nombre }}</option> }
          </select>
        </label>
        <label class="field">
          <span>Referencia remota</span>
          <input type="text" formControlName="remotoReferencia" />
        </label>
        <label class="field">
          <span>Frecuencia (GHz)</span>
          <input type="number" step="0.001" formControlName="frecuenciaGhz" />
        </label>
        <label class="field">
          <span>Ancho de canal (MHz)</span>
          <input type="number" step="1" formControlName="anchoCanalMhz" />
          @if (isInvalid('anchoCanalMhz')) { <small class="field-error">Ingresa un número entero.</small> }
        </label>
        <label class="field field--full">
          <span>SSID del enlace</span>
          <input type="text" formControlName="ssidEnlace" />
        </label>
      </div>
    </app-section-card>
  }

  <app-section-card title="5. Observaciones">
    <i icon class="ti ti-notes" aria-hidden="true"></i>
    <div [formGroup]="form">
      <label class="field">
        <span>Observaciones</span>
        <textarea rows="4" formControlName="observaciones" placeholder="Información adicional relevante para soporte"></textarea>
      </label>
    </div>
  </app-section-card>

  <div class="form-actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || saving">
      {{ saving ? 'Guardando...' : (equipo ? 'Guardar cambios' : meta.nuevo) }}
    </button>
  </div>
</form>
