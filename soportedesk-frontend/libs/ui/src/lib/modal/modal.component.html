@if (open) {
  <div class="overlay">
    <div class="dialog" [class.wide]="size === 'wide'" role="dialog" aria-modal="true" [attr.aria-label]="title">
      <header>
        <h2>{{ title }}</h2>
        <button type="button" class="close" (click)="close()" aria-label="Cerrar modal" title="Cerrar">&times;</button>
      </header>
      <div class="body">
        <ng-content />
      </div>
      @if (!hideDefaultFooter) {
        <footer class="modal-footer">
          <button type="button" class="footer-close" (click)="close()">Cerrar</button>
        </footer>
      }
      @if (hideDefaultFooter) {
        <footer class="modal-footer">
          <ng-content select="[modal-footer]" />
        </footer>
      }
    </div>
  </div>
}
