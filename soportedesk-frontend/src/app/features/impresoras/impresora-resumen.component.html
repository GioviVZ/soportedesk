<div class="resumen-panel">
  <div class="resumen-header" (click)="toggle()">
    <span class="resumen-title">Resumen de consumibles</span>
    <div class="resumen-actions">
      <button type="button" class="export-btn" (click)="exportExcel($event)" [disabled]="rows.length === 0">
        Exportar Excel
      </button>
      <span class="chevron" [class.collapsed]="collapsed">v</span>
    </div>
  </div>

  <div class="resumen-body" [class.hidden]="collapsed">
    <div class="resumen-filters">
      <label>
        Sede
        <select [(ngModel)]="selectedSede" (ngModelChange)="onFilterChange()">
          <option value="">Todas</option>
          @for (s of sedes; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
      <label>
        Dependencia
        <select [(ngModel)]="selectedDependencia" (ngModelChange)="onDependenciaChange()">
          <option value="">Todas</option>
          @for (d of dependencias; track d) {
            <option [value]="d">{{ d }}</option>
          }
        </select>
      </label>
      <label>
        Subdependencia
        <select [(ngModel)]="selectedSubdependencia" (ngModelChange)="onFilterChange()">
          <option value="">Todas</option>
          @for (s of subdependencias; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
      <label>
        Marca
        <select [(ngModel)]="selectedMarca" (ngModelChange)="onMarcaChange()">
          <option value="">Todas</option>
          @for (m of marcas; track m) {
            <option [value]="m">{{ m }}</option>
          }
        </select>
      </label>
      <label>
        Modelo
        <select [(ngModel)]="selectedModelo" (ngModelChange)="onFilterChange()">
          <option value="">Todos</option>
          @for (m of modelos; track m) {
            <option [value]="m">{{ m }}</option>
          }
        </select>
      </label>
    </div>

    @if (rows.length > 0) {
      <table class="resumen-table">
        <thead>
          <tr>
            <th>Consumible</th>
            <th>Modelo</th>
            <th class="count">Impresoras</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows; track row) {
            <tr>
              <td>{{ row.tipoLabel }}</td>
              <td class="modelo">{{ row.modelo }}</td>
              <td class="count">{{ row.cantidad }}</td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="empty-msg">Sin consumibles registrados para esta seleccion.</p>
    }
  </div>
</div>
