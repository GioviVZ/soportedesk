<form [formGroup]="form" (ngSubmit)="submit()" class="impresora-form">
  <app-section-card title="Identificación">
    <svg icon xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 7h16" />
      <path d="M7 3h10v4H7z" />
      <path d="M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" />
      <path d="M6 14h12v7H6z" />
    </svg>

    <div class="two-col">
      <div class="field">
        <label>Marca</label>
        <select [value]="marcaId" (change)="onMarcaChange($any($event.target).value)">
          <option value="">Seleccione...</option>
          <option *ngFor="let m of marcas" [value]="m.id">{{ m.nombre }}</option>
        </select>
      </div>
      <div class="field">
        <label>Modelo</label>
        <select formControlName="modeloImpresoraId">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let modelo of modelos" [ngValue]="modelo.id">{{ modelo.nombre }}</option>
        </select>
      </div>
      <div class="field">
        <label>Tipo de impresora</label>
        <select formControlName="tipoImpresoraId">
          <option [ngValue]="null">— Sin tipo —</option>
          <option *ngFor="let t of tiposImpresora" [ngValue]="t.id">{{ t.nombre }}</option>
        </select>
      </div>
      <div class="field">
        <label>Serie</label>
        <input type="text" formControlName="serie" />
      </div>
      <div class="field">
        <label>Código de Inventario</label>
        <input type="text" formControlName="codigoInventario" />
      </div>
      <div class="field">
        <label>Código Patrimonial</label>
        <input type="text" formControlName="codigoPatrimonial" />
      </div>
      <div class="field">
        <label>Estado</label>
        <div class="estado-selector">
          <app-status-badge
            *ngFor="let opt of estadoOptions"
            [label]="opt.value"
            [tone]="opt.tone"
            [selectable]="true"
            [active]="form.value.estado === opt.value"
            (select)="form.patchValue({ estado: opt.value })"
          />
        </div>
      </div>
      <div class="field field--full">
        <label>Referencia</label>
        <textarea
          formControlName="referencia"
          rows="3"
          placeholder="Ubicación exacta, oficina, responsable o nota visible para consultas"
        ></textarea>
      </div>
    </div>
  </app-section-card>

  <app-section-card title="Conexión">
    <svg icon xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12.55a11 11 0 0 1 14.08 0" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <path d="M12 20h.01" />
    </svg>

    <div class="two-col">
      <div class="field">
        <label>Conexión</label>
        <select formControlName="tipoConexion">
          <option value="USB">USB</option>
          <option value="IP">IP</option>
        </select>
      </div>
      <div class="field" *ngIf="form.value.tipoConexion === 'IP'">
        <label>IP</label>
        <input type="text" formControlName="ip" />
      </div>
    </div>
  </app-section-card>

  <app-section-card title="Ubicación">
    <svg icon xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 21s7-4.35 7-11a7 7 0 1 0-14 0c0 6.65 7 11 7 11z" />
      <circle cx="12" cy="10" r="2" />
    </svg>

    <app-ubicacion-select
      [showTipoContrato]="false"
      [(sedeId)]="sedeId"
      [(dependenciaId)]="dependenciaId"
      [(subdependenciaId)]="subdependenciaId"
    />
  </app-section-card>

  <app-section-card title="Consumibles" *ngIf="modeloSeleccionado">
    <svg icon xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 7h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
      <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <path d="M8 12h8" />
    </svg>

    <ng-container *ngIf="modeloSeleccionado!.toners.length; else sinToner">
      <div class="toner-preview">
        <div class="toner-chip" *ngFor="let toner of modeloSeleccionado!.toners">
          <span>{{ toner.color }} · {{ toner.variante }}</span>
          <strong>{{ toner.codigo }}</strong>
        </div>
      </div>
    </ng-container>
    <ng-template #sinToner>
      <p class="empty-message">Este modelo no tiene tóner registrado en el catálogo.</p>
    </ng-template>
  </app-section-card>

  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>
