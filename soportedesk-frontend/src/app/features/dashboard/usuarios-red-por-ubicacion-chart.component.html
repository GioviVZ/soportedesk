<div class="chart-card">
  <div class="chart-header">
    <div>
      <h3>Usuarios de Red por Ubicacion</h3>
      <p>Comparativo de cuentas activas e inactivas.</p>
    </div>
    <div class="toggle-group" aria-label="Nivel de agrupacion">
      <button type="button" [class.active]="nivel === 'sede'" (click)="setNivel('sede')">Sede</button>
      <button type="button" [class.active]="nivel === 'dependencia'" (click)="setNivel('dependencia')">Dependencia</button>
    </div>
  </div>

  <div class="chart-body" *ngIf="!error">
    <canvas baseChart [data]="chartData" [options]="chartOptions" type="bar"></canvas>
  </div>
  <p class="chart-error" *ngIf="error">No se pudo cargar el grafico</p>
</div>
