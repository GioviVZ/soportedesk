<div class="dashboard">
  <!-- Header -->
  <div class="dash-header">
    <div>
      <h2>Panel de Control</h2>
      <p class="subtitle">Resumen del sistema de soporte técnico INIA</p>
    </div>
    <div class="total-badge">
      <span class="total-num">{{ totalRegistros }}</span>
      <span class="total-lbl">registros totales</span>
    </div>
  </div>

  <!-- KPI Grid -->
  <div class="cards-grid">
    <a class="kpi-card" *ngFor="let card of cards" [routerLink]="card.path" [queryParams]="card.queryParams" [style.--card-color]="card.color" [style.--card-bg]="card.bg">
      <div class="kpi-icon" [innerHTML]="card.icon"></div>
      <div class="kpi-body">
        <span class="kpi-value">{{ card.value }}</span>
        <span class="kpi-label">{{ card.label }}</span>
      </div>
      <div class="kpi-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </a>
  </div>

  <app-usuarios-red-por-ubicacion-chart />
</div>
