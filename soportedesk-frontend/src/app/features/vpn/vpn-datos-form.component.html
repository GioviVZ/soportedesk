<form [formGroup]="form" (ngSubmit)="submit()">

  <div class="field">
    <label>Usuario de red *</label>
    <select formControlName="usuarioRedId">
      <option [ngValue]="null">— Seleccionar —</option>
      <option *ngFor="let u of usuariosRed" [ngValue]="u.id">
        {{ u.nombre }} ({{ u.usuario }})
      </option>
    </select>
  </div>

  <div class="field">
    <label>Equipo asignado (Laptop / Computadora)</label>
    <select formControlName="equipoId">
      <option [ngValue]="null">— Sin equipo —</option>
      <option *ngFor="let e of equiposConRed" [ngValue]="e.id">
        {{ e.tipo }} — {{ e.marca }} {{ e.modelo }}<ng-container *ngIf="e.host"> ({{ e.host }})</ng-container>
      </option>
    </select>
    <small *ngIf="equipoSeleccionado?.ip" class="hint">
      IP: {{ equipoSeleccionado?.ip }}
    </small>
  </div>

  <div class="field">
    <label>IP VPN asignada</label>
    <input type="text" formControlName="ipAsignada" placeholder="10.0.0.x" />
  </div>

  <div class="field">
    <label>Vence (VPN)</label>
    <input type="date" formControlName="vence" />
  </div>

  <div class="field">
    <label>Estado</label>
    <select formControlName="estado">
      <option value="Activo">Activo</option>
      <option value="Inactivo">Inactivo</option>
    </select>
  </div>

  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>
