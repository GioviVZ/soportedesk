<form [formGroup]="form" (ngSubmit)="submit()">

  <div class="field">
    <label>¿Tiene antivirus?</label>
    <select formControlName="tieneAntivirus">
      <option [ngValue]="null">— Sin registrar —</option>
      <option [ngValue]="true">Sí</option>
      <option [ngValue]="false">No</option>
    </select>
  </div>

  <div class="field">
    <label>Vencimiento antivirus</label>
    <input type="date" formControlName="vencimientoAntivirus" />
  </div>

  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit">Guardar</button>
  </div>
</form>
