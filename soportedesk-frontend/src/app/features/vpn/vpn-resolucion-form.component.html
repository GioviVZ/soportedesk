<form [formGroup]="form" (ngSubmit)="submit()" *ngIf="vpn" id="vpn-resolucion-edit-form">
  <div class="field">
    <label>Comentario *</label>
    <textarea formControlName="comentarioResponsable" rows="4" placeholder="Explica el motivo para el asistente"></textarea>
  </div>

</form>

<div modal-footer class="actions" *ngIf="vpn">
  <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
  <button type="submit" form="vpn-resolucion-edit-form" [disabled]="form.invalid">{{ titulo }}</button>
</div>
