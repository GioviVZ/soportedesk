<section class="generator" aria-label="Generador de contraseñas VPN">
  <div class="generated-row">
    <input type="text" [value]="generatedPassword" readonly aria-label="Contraseña generada" />
    <button type="button" class="icon-action" title="Regenerar" (click)="generate()">↻</button>
    <button type="button" class="icon-action" title="Copiar" (click)="copy()">⧉</button>
  </div>

  <div class="length-row">
    <label for="vpn-password-length">Longitud</label>
    <strong>{{ length }}</strong>
  </div>
  <input
    id="vpn-password-length"
    class="length-slider"
    type="range"
    [min]="minLength"
    [max]="maxLength"
    [(ngModel)]="length"
    (input)="onLengthChange()"
  />
  <div class="range-labels">
    <span>{{ minLength }}</span>
    <span>{{ maxLength }}</span>
  </div>

  <div class="options">
    <label>
      <input type="checkbox" [(ngModel)]="includeUppercase" (change)="onOptionChange()" />
      A-Z
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="includeLowercase" (change)="onOptionChange()" />
      a-z
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="includeNumbers" (change)="onOptionChange()" />
      0-9
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="includeSymbols" (change)="onOptionChange()" />
      Símbolos
    </label>
    <label class="wide">
      <input type="checkbox" [(ngModel)]="avoidAmbiguous" (change)="onOptionChange()" />
      Evitar caracteres ambiguos
    </label>
  </div>

  <div class="footer">
    <span class="strength" [class]="strengthClass">{{ strength }}</span>
    <span class="copy-state" *ngIf="copied">Copiada</span>
    <button type="button" class="use-button" (click)="usePassword()">Usar contraseña</button>
  </div>
</section>
