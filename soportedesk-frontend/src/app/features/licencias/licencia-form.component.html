<form [formGroup]="form" (ngSubmit)="submit()" class="licencia-form">
  <div class="form-grid">
    <div class="field">
      <label>Tipo de Licencia</label>
      <select [value]="tipoLicenciaId" (change)="onTipoLicenciaChange($any($event.target).value)">
        <option [ngValue]="null">Seleccione...</option>
        <option *ngFor="let t of tiposLicencia" [value]="t.id">{{ t.nombre }}</option>
      </select>
    </div>
    <div class="field">
      <label>Tipo de Bien</label>
      <select [value]="tipoBienId" (change)="onTipoBienChange($any($event.target).value)">
        <option [ngValue]="null">Seleccione...</option>
        <option *ngFor="let t of tiposBien" [value]="t.id">{{ t.nombre }}</option>
      </select>
    </div>
    <div class="field wide">
      <label>Descripcion</label>
      <input type="text" formControlName="descripcion" />
    </div>
    <div class="field">
      <label>Orden de Compra</label>
      <input type="text" formControlName="ordenCompra" />
    </div>
    <div class="field">
      <label>Anio</label>
      <input type="text" formControlName="anio" />
    </div>
    <div class="field">
      <label>Cantidad</label>
      <input type="number" formControlName="cantidad" min="1" />
    </div>
  </div>

  <section class="activation-section">
    <div class="section-heading">
      <div>
        <h3>Cuentas y claves de activacion</h3>
        <p>Agrega una fila por cada cuenta o clave comprada en esta orden.</p>
      </div>
      <button type="button" class="secondary compact" (click)="addActivacion()">Agregar cuenta</button>
    </div>

    <div class="activation-list" formArrayName="activaciones">
      <div class="activation-row" *ngFor="let group of activacionesArray.controls; let i = index" [formGroupName]="i">
        <div class="field">
          <label>Cuenta {{ i + 1 }}</label>
          <input
            type="text"
            formControlName="cuentaActivacion"
            placeholder="correo o cuenta de activacion"
          />
        </div>
        <div class="field">
          <label>Clave {{ i + 1 }}</label>
          <input
            type="text"
            formControlName="claveActivacion"
            placeholder="clave asociada"
          />
        </div>
        <button type="button" class="icon-btn" (click)="removeActivacion(i)" title="Quitar cuenta">Quitar</button>
      </div>
    </div>
  </section>

  <div class="field">
    <label>Serial de Activacion</label>
    <textarea formControlName="serialActivacion" rows="5" placeholder="Una clave por linea"></textarea>
  </div>

  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || !tipoLicenciaId || !tipoBienId">Guardar</button>
  </div>
</form>
