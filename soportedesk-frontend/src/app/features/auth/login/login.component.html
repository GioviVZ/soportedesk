<div class="login-page">
  <!-- Left panel - brand -->
  <div class="login-brand">
    <div class="brand-content">
      <div class="brand-icon">
        <i class="ti ti-stack-2" aria-hidden="true"></i>
      </div>
      <h1 class="brand-title">Sistema Gestión de Soporte Informático</h1>
      <p class="brand-subtitle">Instituto Nacional de Innovación Agraria</p>
      <div class="brand-features">
        <div class="feature-item">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          Gestión de licencias y correos
        </div>
        <div class="feature-item">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          Control de equipos y VPN
        </div>
        <div class="feature-item">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          Dashboard en tiempo real
        </div>
      </div>
    </div>
  </div>

  <!-- Right panel - form -->
  <div class="login-form-panel">
    <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-header-row">
        <div class="form-header">
          <h2>Iniciar Sesión</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>
        <button
          type="button"
          class="theme-toggle"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Usar modo claro' : 'Usar modo oscuro'"
          [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
          >
          @if (themeService.theme() === 'dark') {
            <i class="ti ti-sun-high" aria-hidden="true"></i>
          } @else {
            <i class="ti ti-moon-stars" aria-hidden="true"></i>
          }
        </button>
      </div>

      <div class="form-field">
        <label for="username">
          <i class="ti ti-user" aria-hidden="true"></i>
          Usuario
        </label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Tu usuario de acceso"
          autocomplete="username"
          />
      </div>

      <div class="form-field">
        <label for="password">
          <i class="ti ti-lock" aria-hidden="true"></i>
          Contraseña
        </label>
        <div class="input-group">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            />
          <button type="button" class="eye-btn" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar' : 'Mostrar'">
            @if (!showPassword) {
              <i class="ti ti-eye" aria-hidden="true"></i>
            }
            @if (showPassword) {
              <i class="ti ti-eye-off" aria-hidden="true"></i>
            }
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-msg" role="alert">
          <i class="ti ti-alert-circle" aria-hidden="true"></i>
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="submit-btn" [disabled]="form.invalid || loading">
        @if (loading) {
          <i class="spin ti ti-loader-2" aria-hidden="true"></i>
        }
        <span>{{ loading ? 'Ingresando...' : 'Ingresar al sistema' }}</span>
      </button>
    </form>
  </div>
</div>
