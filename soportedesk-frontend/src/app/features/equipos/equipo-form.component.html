<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="two-col">
    <div class="field">
      <label>Tipo</label>
      <select formControlName="tipo">
        <option value="">Seleccione...</option>
        <option *ngFor="let t of tiposEquipo" [value]="t">{{ t }}</option>
      </select>
    </div>
    <div class="field">
      <label>Marca</label>
      <input type="text" formControlName="marca" />
    </div>
    <div class="field">
      <label>Modelo</label>
      <input type="text" formControlName="modelo" />
    </div>
    <div class="field">
      <label>Número de serie</label>
      <input type="text" formControlName="numeroSerie" />
    </div>
    <div class="field">
      <label>Código patrimonial</label>
      <input type="text" formControlName="codigoPatrimonial" />
    </div>
    <div class="field">
      <label>Código de inventario</label>
      <input type="text" formControlName="codigoInventario" />
    </div>
    <ng-container *ngIf="tieneRed">
      <div class="field">
        <label>Host</label>
        <input type="text" formControlName="host" />
      </div>
      <div class="field">
        <label>IP</label>
        <input type="text" formControlName="ip" />
      </div>
    </ng-container>
    <div class="field">
      <label>Estado</label>
      <select formControlName="estado">
        <option value="Activo">Activo</option>
        <option value="En reparación">En reparación</option>
        <option value="De baja">De baja</option>
      </select>
    </div>
    <div class="field">
      <label>Fecha de asignación</label>
      <input type="date" formControlName="asignado" />
    </div>
  </div>

  <div class="field">
    <label>Usuario asignado</label>
    <select [value]="usuarioRedId" (change)="onUsuarioChange($any($event.target).value)">
      <option [ngValue]="null">Sin asignar</option>
      <option *ngFor="let u of usuariosRed" [value]="u.id">{{ u.nombre }} ({{ u.usuario }})</option>
    </select>
  </div>

  <app-ubicacion-select
    [showTipoContrato]="false"
    [(sedeId)]="sedeId"
    [(dependenciaId)]="dependenciaId"
    [(subdependenciaId)]="subdependenciaId"
  />

  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>
