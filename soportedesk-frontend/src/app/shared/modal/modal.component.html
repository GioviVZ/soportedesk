<div class="overlay" *ngIf="open" (click)="close()">
  <div class="dialog" [class.wide]="size === 'wide'" (click)="$event.stopPropagation()">
    <header>
      <h2>{{ title }}</h2>
      <button type="button" class="close" (click)="close()">×</button>
    </header>
    <div class="body">
      <ng-content />
    </div>
  </div>
</div>
