<div class="overlay" *ngIf="open" (click)="close()">
  <div class="dialog" [class.wide]="size === 'wide'" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <header>
      <h2>{{ title }}</h2>
      <button type="button" class="close" (click)="close()" aria-label="Cerrar modal" title="Cerrar">&times;</button>
    </header>
    <div class="body">
      <ng-content />
    </div>
    <footer class="modal-footer" *ngIf="!hideDefaultFooter">
      <button type="button" class="footer-close" (click)="close()">Cerrar</button>
    </footer>
    <footer class="modal-footer" *ngIf="hideDefaultFooter">
      <ng-content select="[modal-footer]" />
    </footer>
  </div>
</div>
