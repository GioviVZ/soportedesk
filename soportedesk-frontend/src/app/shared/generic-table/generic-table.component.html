<div class="table-toolbar">
  <div class="search-wrap">
    <span class="search-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" placeholder="Buscar..." [value]="searchTerm" (input)="onSearch($any($event.target).value)" />
  </div>
  <span class="result-count">{{ data.length }} {{ data.length === 1 ? 'registro' : 'registros' }}</span>
  <button *ngIf="canEdit" class="add-btn" (click)="add.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Agregar
  </button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.label }}</th>
        <th *ngIf="extraColumnLabel">{{ extraColumnLabel }}</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of data">
        <td *ngFor="let col of columns">{{ getValue(row, col.key) }}</td>
        <td *ngIf="extraColumnLabel">
          <ng-container *ngTemplateOutlet="extraCellTemplate ?? null; context: { $implicit: row }" />
        </td>
        <td class="actions">
          <button class="view-btn" (click)="view.emit(row)">Ver</button>
          <button *ngIf="canEdit" class="edit-btn" (click)="edit.emit(row)">Editar</button>
          <button *ngIf="canEdit" class="del-btn" (click)="delete.emit(row)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="data.length === 0">
        <td [attr.colspan]="columns.length + (extraColumnLabel ? 2 : 1)" class="empty">
          <ng-container *ngIf="searchTerm.trim()">No se encontraron resultados para "{{ searchTerm }}"</ng-container>
          <ng-container *ngIf="!searchTerm.trim()">Sin registros aún</ng-container>
        </td>
      </tr>
    </tbody>
  </table>
</div>
