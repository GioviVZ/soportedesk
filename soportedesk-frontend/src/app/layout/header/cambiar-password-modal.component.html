<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label>Contraseña actual</label>
    <input type="password" formControlName="passwordActual" autocomplete="current-password" />
  </div>
  <div class="field">
    <label>Nueva contraseña</label>
    <input type="password" formControlName="passwordNueva" autocomplete="new-password" />
  </div>
  <div class="field">
    <label>Confirmar nueva contraseña</label>
    <input type="password" formControlName="confirmarPassword" autocomplete="new-password" />
  </div>

  <div class="error-msg" *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmarPassword')?.touched" role="alert">Las contraseñas no coinciden</div>

  <div class="error-msg" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

  <div class="actions">
    <button type="button" class="secondary" (click)="cancel()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || loading">{{ loading ? 'Guardando...' : 'Cambiar contraseña' }}</button>
  </div>
</form>
