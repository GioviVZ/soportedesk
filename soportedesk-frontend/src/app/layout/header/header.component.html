<header class="header">
  <!-- Hamburger (mobile) -->
  <button type="button" class="hamburger" (click)="layout.toggle()" aria-label="Menú">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="header-left">
    <span class="system-name">SoporteDesk <span class="inia">INIA</span></span>
    <small class="system-subtitle">Panel operativo de tecnología</small>
  </div>

  <div class="header-right">
    <div class="user-chip" (click)="toggleMenu()">
      <div class="avatar">{{ initials }}</div>
      <div class="user-info">
        <span class="nombre">{{ nombre }}</span>
        <span class="rol-badge" [class.admin]="rol === 'ADMIN'">{{ rol }}</span>
      </div>

      <div class="user-menu" *ngIf="menuOpen" (click)="$event.stopPropagation()">
        <button type="button" (click)="openCambiarPassword()">Cambiar contraseña</button>
      </div>
    </div>

    <button type="button" class="logout-btn" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Salir</span>
    </button>
  </div>
</header>

<app-modal title="Cambiar contraseña" [open]="cambiarPasswordOpen" (closed)="closeCambiarPassword()">
  <app-cambiar-password-modal (saved)="onPasswordChanged()" (cancelled)="closeCambiarPassword()" />
</app-modal>
