<header class="header">
  <button
    type="button"
    class="hamburger"
    (click)="layout.toggle()"
    aria-label="Abrir menú principal"
    aria-controls="main-sidebar"
    [attr.aria-expanded]="layout.sidebarOpen()"
  >
    <i class="ti ti-menu-2" aria-hidden="true"></i>
    <span>Módulos</span>
  </button>

  <div class="header-left">
    <span class="system-name">SoporteDesk <span class="inia">INIA</span></span>
    <small class="system-subtitle greeting-line">
      <i class="ti {{ saludoIcon }}" aria-hidden="true"></i>
      <span>{{ saludo }}, <strong>{{ primerNombre }}</strong></span>
    </small>
  </div>

  <div class="header-right">
    <button
      type="button"
      class="header-icon-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Usar modo claro' : 'Usar modo oscuro'"
      [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
    >
      <i class="ti" [class.ti-sun-high]="themeService.theme() === 'dark'" [class.ti-moon-stars]="themeService.theme() !== 'dark'" aria-hidden="true"></i>
    </button>

    <div
      class="user-chip"
      role="button"
      tabindex="0"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen"
      [class.is-open]="menuOpen"
      (click)="toggleMenu()"
      (keydown.enter)="toggleMenu()"
      (keydown.space)="toggleMenu(); $event.preventDefault()"
    >
      <div class="avatar">{{ initials }}</div>
      <div class="user-info">
        <span class="nombre">{{ nombre }}</span>
        <span class="rol-badge" [class.admin]="rol === 'ADMIN'">{{ rol }}</span>
      </div>
      <i class="user-chevron ti ti-chevron-down" aria-hidden="true"></i>

      @if (menuOpen) {
        <div class="user-menu" role="menu" (click)="$event.stopPropagation()">
          <button type="button" role="menuitem" (click)="openCambiarPassword()">
            <i class="ti ti-lock-password" aria-hidden="true"></i>
            Cambiar contraseña
          </button>
        </div>
      }
    </div>

    <button type="button" class="logout-btn" (click)="logout()" title="Cerrar sesión">
      <i class="ti ti-logout-2" aria-hidden="true"></i>
      <span>Salir</span>
    </button>
  </div>
</header>

<app-modal title="Cambiar contraseña" [open]="cambiarPasswordOpen" [hideDefaultFooter]="true" (closed)="closeCambiarPassword()">
  <app-cambiar-password-modal (saved)="onPasswordChanged()" (cancelled)="closeCambiarPassword()" />
</app-modal>
