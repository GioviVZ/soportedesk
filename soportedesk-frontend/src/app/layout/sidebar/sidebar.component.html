<aside id="main-sidebar" class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="layout.sidebarOpen()">
  <div class="brand">
    <div class="brand-logo">
      <i class="ti ti-stack-2" aria-hidden="true"></i>
    </div>
    @if (!collapsed) {
      <div class="brand-copy">
        <strong>SoporteDesk</strong>
        <small>INIA · Gestión de TI</small>
      </div>
    }
    @if (!collapsed) {
      <button type="button" class="mobile-close" (click)="layout.close()" aria-label="Cerrar menu">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    }
  </div>

  <nav>
    @for (item of navItems; track item) {
      @if (canShow(item)) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          #rla="routerLinkActive"
          class="nav-item"
          [class.admin-item]="item.adminOnly"
          [title]="collapsed ? item.label : ''"
          (click)="layout.close()"
          (mouseenter)="hoveredPath = item.path"
          (mouseleave)="hoveredPath = null"
          >
          <span class="nav-icon">
            <app-animated-nav-icon [name]="item.icon" [active]="iconActive(item, rla.isActive)" />
          </span>
          @if (!collapsed) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>

  <button type="button" class="collapse-btn" (click)="toggleCollapsed()" [title]="collapsed ? 'Expandir' : 'Colapsar'">
    <i class="ti" [class.ti-chevrons-right]="collapsed" [class.ti-chevrons-left]="!collapsed" aria-hidden="true"></i>
    @if (!collapsed) {
      <span class="collapse-label">Colapsar</span>
    }
  </button>
</aside>
