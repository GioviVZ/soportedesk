<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="layout.sidebarOpen()">
  <div class="brand">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    @if (!collapsed) {
      <div class="brand-copy">
        <strong>SoporteDesk</strong>
        <small>INIA · Gestión de TI</small>
      </div>
    }
    @if (!collapsed) {
      <button type="button" class="mobile-close" (click)="layout.close()" aria-label="Cerrar menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    }
  </div>

  <nav>
    @for (item of navItems; track item) {
      @if (canShow(item)) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-item"
          [class.admin-item]="item.adminOnly"
          [title]="collapsed ? item.label : ''"
          (click)="layout.close()"
          >
          <span class="nav-icon" [innerHTML]="item.icon"></span>
          @if (!collapsed) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>

  <button type="button" class="collapse-btn" (click)="toggleCollapsed()" [title]="collapsed ? 'Expandir' : 'Colapsar'">
    <span [innerHTML]="collapsed ? chevR : chevL"></span>
    @if (!collapsed) {
      <span class="collapse-label">Colapsar</span>
    }
  </button>
</aside>
