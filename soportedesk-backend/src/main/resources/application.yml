spring:
  application:
    name: soportedesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

licencia:
  encryption-key: ${LICENCIA_ENCRYPTION_KEY}

agente:
  inventario-token: ${AGENTE_INVENTARIO_TOKEN}

uploads:
  drivers-dir: uploads/drivers
  evidencias-dir: uploads/evidencias
  intervenciones-dir: uploads/impresoras-intervenciones

equipos:
  # Job que mantiene dbo.equipo_asignacion al dia con glpi_computers.
  # Por defecto todos los dias a las 3am. Cambiar solo si hace falta
  # correrlo con otra frecuencia.
  sync-glpi-cron: "0 0 3 * * *"

identidad:
  # Job que detecta cuentas AD nuevas sin persona y las deja en
  # persona_candidato para revision -- nunca crea persona solo.
  # Corre 30 minutos despues que el de equipos para no competir por I/O.
  reconciliacion-cron: "0 30 3 * * *"

ad:
  url: ${AD_URL:ldaps://SRV-DC02.inia.local:636}
  base-dn: ${AD_BASE_DN:DC=inia,DC=local}
  bind-user: ${AD_BIND_USER:svc_appinfra_ad@inia.local}
  bind-password: ${AD_BIND_PASSWORD:}
  referral: ${AD_REFERRAL:ignore}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SSTI_DB_URL}
    username: ${SSTI_DB_USERNAME}
    password: ${SSTI_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

glpi:
  datasource:
    url: ${GLPI_DB_URL}
    username: ${GLPI_DB_USERNAME}
    password: ${GLPI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
