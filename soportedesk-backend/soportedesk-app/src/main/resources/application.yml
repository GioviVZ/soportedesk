spring:
  application:
    name: soportedesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

licencia:
  encryption-key: ${LICENCIA_ENCRYPTION_KEY}

uploads:
  drivers-dir: uploads/drivers
  evidencias-dir: uploads/evidencias
  intervenciones-dir: uploads/impresoras-intervenciones
  actas-moviles-dir: uploads/actas-moviles

equipos:
  # Job que mantiene dbo.equipo_asignacion al dia con glpi_computers.
  # Por defecto todos los dias a las 3am. Cambiar solo si hace falta
  # correrlo con otra frecuencia.
  sync-glpi-cron: "0 0 3 * * *"
  # Refresco del cache local de inventario GLPI (equipo_glpi_cache).
  # Corre cada 5 min por defecto; fixedDelay evita solapes (espera a
  # que termine la corrida anterior antes de contar el intervalo).
  glpi-cache-sync-interval-ms: 300000

monitoreo-ping:
  despacho-ms: 1000
  max-concurrentes: 10
  retencion-detalle-dias: 7
  retencion-resumen-dias: 365
  retencion-cron: "0 15 2 * * *"

ad:
  url: ${AD_URL:ldaps://SRV-DC02.inia.local:636}
  base-dn: ${AD_BASE_DN:DC=inia,DC=local}
  bind-user: ${AD_BIND_USER:svc_appinfra_ad@inia.local}
  bind-password: ${AD_BIND_PASSWORD:}
  referral: ${AD_REFERRAL:ignore}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SSTI_DB_URL}
    username: ${SSTI_DB_USERNAME}
    password: ${SSTI_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

glpi:
  datasource:
    url: ${GLPI_DB_URL}
    username: ${GLPI_DB_USERNAME}
    password: ${GLPI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
